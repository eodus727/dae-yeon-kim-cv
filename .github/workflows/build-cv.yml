name: Build CV PDF

on:
  push:
    branches: [main]
    paths:
      - 'CV_DYK.tex'
      - '.github/workflows/build-cv.yml'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Compile LaTeX to PDF
        uses: xu-cheng/latex-action@v3
        with:
          root_file: CV_DYK.tex

      - name: Commit updated PDF
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "Auto-build CV PDF"
          file_pattern: CV_DYK.pdf

      - name: Purge jsDelivr cache
        # jsDelivr caches the @main -> commit mapping for a few minutes, so purge until it serves the new PDF
        run: |
          url="gh/eodus727/dae-yeon-kim-cv@main/CV_DYK.pdf"
          for i in $(seq 1 15); do
            sleep 60
            curl -sS --retry 3 "https://purge.jsdelivr.net/$url" > /dev/null
            sleep 10
            curl -sSL "https://cdn.jsdelivr.net/$url" -o served.pdf
            if cmp -s served.pdf CV_DYK.pdf; then echo "jsDelivr updated (attempt $i)"; exit 0; fi
            echo "jsDelivr still stale (attempt $i)"
          done
          echo "::warning::jsDelivr still serves an old CV_DYK.pdf"
